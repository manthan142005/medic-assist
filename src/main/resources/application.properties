# Application Configuration
spring.application.name=mediassist

# Server Configuration
server.port=${SERVER_PORT:9091}

# Database Configuration (Supplied via Environment Variables)
spring.datasource.url=jdbc:mysql://localhost:3306/mediassist_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# Schema modification is disabled; schema is strictly managed and validated against Flyway migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Security Configuration (Supplied via Environment Variables)
jwt.secret=${JWT_SECRET:c3VwZXJzZWNyZXRrZXlmb3JtZWRpYXNzaXN0YXBwbGljYXRpb25qd3RhdXRoZW50aWNhdGlvbjEyMzQ1Njc4OTA=}
jwt.expiration=${JWT_EXPIRATION:86400000}
