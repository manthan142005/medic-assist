# MediAssist Test Environment Configuration
# Uses in-memory H2 database with MySQL compatibility mode for isolated, fast, deterministic testing

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway disabled for unit/slice in-memory tests so tests run self-contained
spring.flyway.enabled=false

